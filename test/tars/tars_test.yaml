schemaVersion: 2.0.0

fileExistenceTests:
  - name: the executable keeps the tarball's group-writable mode
    path: /usr/bin/tool
    shouldExist: true
    permissions: "-rwxrwxr-x"
  - name: the config keeps the tarball's owner-and-group-only mode
    path: /etc/tool.conf
    shouldExist: true
    permissions: "-rw-rw----"
  - name: the declared file has the layer's default mode
    path: /etc/motd
    shouldExist: true
    permissions: "-rw-r--r--"
  - name: the layer writes the parent directory the tarball does not hold
    path: /etc
    shouldExist: true
    permissions: "drwxr-xr-x"

fileContentTests:
  - name: the symlink resolves to the executable
    path: /usr/bin/tool-alias
    expectedContents: ["^#!/bin/sh\n$"]
