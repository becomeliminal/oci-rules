# Publishes what changed on main, once its tests pass on Linux and macOS:
# oci_tool when tools/oci_tool/VERSION has no release yet (tag
# oci-tool-v<version>), then the plugin when VERSION has none (tag v<version>).
# A version that already has a release is left as it is.
name: Release

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # One cache directory on Linux and macOS, in the runner's temp
      # directory: actions/cache refuses paths with '..', and the runner
      # context isn't available to a job's env.
      - name: Point Please's cache at the runner's temp directory
        run: echo "PLZ_ARGS=-o cache.dir:$RUNNER_TEMP/plz-cache" >> "$GITHUB_ENV"

      # Please's build cache and its own install, restored from the newest run
      # on this OS and architecture and saved again after this one. Please's
      # cache is keyed by each action's inputs, so a restored entry is only
      # ever the output those inputs build: it saves time, and changes nothing.
      - name: Restore Please's cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.please
            ${{ runner.temp }}/plz-cache
          key: plz-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: plz-${{ runner.os }}-${{ runner.arch }}-

      # The binaries are the pinned ones or nothing is published: the test
      # compares each build with tools/release.build_defs.
      - name: Build oci_tool for every platform
        run: |
          ./pleasew test -p -v notice //package:release_hashes_test
          ./pleasew build -p -v notice //package:oci_tool_release_files
          mkdir -p dist/oci_tool
          cp plz-out/gen/package/oci_tool-* dist/oci_tool/
          shasum -a 256 dist/oci_tool/*

      - name: Release oci_tool
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: thought-machine/release-action@0dfdc6c2e233ff85c0e1ac9338e54081962d7ba6
        with:
          version-file: tools/oci_tool/VERSION
          change-log-file: tools/oci_tool/ChangeLog
          release-prefix: oci-tool
          release-files: dist/oci_tool

      - name: Release the plugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: thought-machine/release-action@0dfdc6c2e233ff85c0e1ac9338e54081962d7ba6
